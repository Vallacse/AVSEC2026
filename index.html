<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVS College - ID Generator</title>
    <style>
        :root {
            --grad-start: #8e2de2;
            --grad-end: #4a00e0;
            --accent-cyan: #70e1f5;
            --bg-color: #f0f2f5;
            --text-dark: #111;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: linear-gradient(135deg,
                    var(--bg-color),
                    #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            /* Prevent scrollbars from the background */
        }

        /* Dynamic Loop Background */
        .loop-container {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: -1;
            transform: rotate(-25deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            pointer-events: none;
            background: #ffffff;
        }

        .loop-row {
            font-family: 'Times New Roman', Times, serif;
            white-space: nowrap;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 6px;
            color: rgba(0, 0, 0, 0.12);
            line-height: 1.8;
            user-select: none;
        }

        /* Animations for smoothness */
        .loop-row:nth-child(odd) {
            animation: slideLeft 40s linear infinite;
        }

        .loop-row:nth-child(even) {
            animation: slideRight 45s linear infinite;
        }

        @keyframes slideLeft {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-1000px);
            }
        }

        @keyframes slideRight {
            from {
                transform: translateX(-1000px);
            }

            to {
                transform: translateX(0);
            }
        }

        .form-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        .header_logo {
            size: 100px;
            max-height: 1000%;
            /* ensures it never grows */
            max-width: 1000%;
            object-fit: contain;
        }

        .logo-wrapper {
            width: 100%;
            height: 20px;
            /* FIXED height, not % */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;

        }

        h2 {
            color: var(--grad-end);
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        h3 {
            color: #555;
            text-align: center;
            margin-bottom: 25px;
            font-size: 0.9rem;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, var(--grad-start), var(--grad-end));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        #idCanvas {
            display: none;
        }
    </style>
</head>

<body>
    <!-- Background Container -->
    <div class="loop-container" id="loopContainer"></div>
    <div class="form-box">
        <div class="logo-wrapper">
            <img src="./logo.png" class="header_logo" />
        </div>
        <h2>Future Identity Card</h2>


        <form id="idForm">
            <div class="form-group">
                <label>Student Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Dream Role</label>
                <input type="text" id="role" placeholder="e.g. AI Specialist" required>
            </div>
            <div class="form-group">
                <label>Dream Company</label>
                <input type="text" id="company" placeholder="e.g. Google" required>
            </div>
            <div class="form-group">
                <label>Upload Photo</label>
                <input type="file" id="photo" accept="image/*" required>
            </div>
            <button type="submit">Generate ID Card</button>
        </form>
    </div>

    <canvas id="idCanvas" width="800" height="1000"></canvas>

    <script>
        const form = document.getElementById('idForm');
        const canvas = document.getElementById('idCanvas');
        const ctx = canvas.getContext('2d');

        const colors = {
            purple: '#8e2de2',
            deepBlue: '#4a00e0',
            cyanAccent: '#70e1f5',
            white: '#ffffff',
            darkText: '#2c3e50',
            lightText: '#7f8c8d'
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const role = document.getElementById('role').value;
            const company = document.getElementById('company').value;
            const photoFile = document.getElementById('photo').files[0];

            // 1. Load User Photo
            const userImg = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.src = event.target.result;
                };
                reader.readAsDataURL(photoFile);
            });

            // 2. Load QR Code (Centered where barcode was)
            const qrData = `https://www.google.com/search?q=${encodeURIComponent(role)}+at+${encodeURIComponent(company)}`;
            const qrImg = await new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => resolve(img);
                img.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(qrData)}&color=4a00e0`;
            });

            drawIDCard(name, role, company, userImg, qrImg);
        });
        const logoImg = new Image();
        logoImg.src = './idcard.png';

        function drawIDCard(name, role, company, userImg, qrImg) {
            const W = canvas.width;
            const H = canvas.height;

            // Background
            ctx.fillStyle = colors.white;
            ctx.fillRect(0, 0, W, H);

            // Top Gradient Wave
            const topGrad = ctx.createLinearGradient(0, 0, W, 400);
            topGrad.addColorStop(0, colors.purple);
            topGrad.addColorStop(1, colors.deepBlue);
            ctx.fillStyle = topGrad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(W, 0);
            ctx.lineTo(W, 300);
            ctx.bezierCurveTo(W * 0.6, 400, W * 0.3, 200, 0, 320);
            ctx.closePath();
            ctx.fill();

            const logoScale = W / logoImg.width;     // scale by width
            const logoWidth = W;                     // 800
            const logoHeight = logoImg.height * logoScale - 70;

            const logoX = 0;
            const logoY = 0;

            ctx.drawImage(logoImg, logoX, logoY, logoWidth, logoHeight);
            // // College Logo (Top Center – BIG & CLEAN)
            // const logoWidth = 800;     // increased
            // const logoHeight = 800;    // keep 2:1 ratio
            // const logoX = 0
            // const logoY = -100;         // moved slightly down

            // ctx.drawImage(logoImg, logoX, logoY, logoWidth, logoHeight);


            // Cyan Accent Wave
            ctx.fillStyle = colors.cyanAccent;
            ctx.beginPath();
            ctx.moveTo(0, 320);
            ctx.bezierCurveTo(W * 0.3, 200, W * 0.6, 400, W, 300);
            ctx.lineTo(W, 350);
            ctx.bezierCurveTo(W * 0.6, 450, W * 0.3, 250, 0, 370);
            ctx.closePath();
            ctx.fill();


            // // College Header
            // ctx.fillStyle = colors.white;
            // ctx.textAlign = 'center';
            // ctx.font = 'bold 34px Arial';
            // ctx.fillText("AVS ENGINEERING COLLEGE", W / 2, 80);
            // ctx.font = '22px Arial';
            // ctx.fillText("(AUTONOMOUS)", W / 2, 115);

            // Profile Picture Circle
            const photoRadius = 155;
            const px = W / 2;
            const py = 340;

            ctx.beginPath();
            ctx.arc(px, py, photoRadius + 8, 0, Math.PI * 2);
            ctx.fillStyle = colors.white;
            ctx.fill();

            ctx.save();
            ctx.beginPath();
            ctx.arc(px, py, photoRadius, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(userImg, px - photoRadius, py - photoRadius, photoRadius * 2, photoRadius * 2);
            ctx.restore();

            // Name
            ctx.textAlign = 'center';
            ctx.fillStyle = colors.darkText;
            ctx.font = 'bold 50px Times New Roman';
            ctx.fillText(name.toUpperCase(), W / 2, 565);

            // Role
            ctx.fillStyle = colors.deepBlue;
            ctx.font = 'bold  28px Times New Roman';
            ctx.fillText(role.toUpperCase(), W / 2, 615);

            // Company (dark & bold)
            ctx.fillStyle = '#111111';              // deep black, not washed
            ctx.font = 'bold 30px Times New Roman'; // bigger = visually heavier
            ctx.fillText(company.toUpperCase(), W / 2, 650);



            // Centered QR Code (Replacing Barcode)
            const qrSize = 180;
            ctx.drawImage(qrImg, (W / 2) - (qrSize / 2), 700, qrSize, qrSize);

            ctx.font = 'bold 16px Times New Roman';
            ctx.fillStyle = '#000000';
            ctx.fillText("SCAN TO VIEW CAREER PATH", W / 2, 900);

            // Bottom Decorative Wave
            ctx.fillStyle = colors.deepBlue;
            ctx.beginPath();
            ctx.moveTo(0, H);
            ctx.lineTo(W, H);
            ctx.lineTo(W, H - 40);
            ctx.quadraticCurveTo(W / 2, H - 100, 0, H - 40);
            ctx.fill();

            // Trigger Download
            const link = document.createElement('a');
            link.download = `${name}_Career_ID.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        // Generate Loop Background

        function generateBg() {
            const container = document.getElementById('loopContainer');
            const phrase = "AVSEC   ".repeat(50);
            const rows = 100;

            for (let i = 0; i < rows; i++) {
                const div = document.createElement('div');
                div.className = 'loop-row';
                div.textContent = phrase;
                container.appendChild(div);
            }
        }

        generateBg();

    </script>
</body>

</html>
